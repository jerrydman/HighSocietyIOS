# Optional: generate the Xcode project with XcodeGen (brew install xcodegen, then run `xcodegen` in this folder).
name: HighSociety
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
targets:
  HighSociety:
    type: application
    platform: iOS
    sources:
      - HighSociety
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: High Society
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.example.highsociety
            CFBundleURLSchemes: [highsociety]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.highsociety
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
